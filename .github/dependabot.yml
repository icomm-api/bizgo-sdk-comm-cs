version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-runtime:
        patterns: ["System.*", "Microsoft.Bcl.*"]
      test:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "YamlDotNet", "Microsoft.NETFramework.ReferenceAssemblies"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
